  /* ============================================================
     LEVEL 9 — Tap in order  (HARD, has hint)
     ============================================================ */
  function level9(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML = '<div class="l9-base"></div><div class="l9-flash" id="l9flash"></div>';
    root.appendChild(wrap);

    var W = window.innerWidth, H = window.innerHeight;
    var cx = W/2, cy = H/2;
    var offsets = [ [-70,-70], [70,-70], [70,70], [-70,70] ];
    var order = [0,1,2,3].sort(function(){ return Math.random()-0.5; });
    var brightness = [0.85, 0.68, 0.5, 0.34];
    var dots = [];
    var nextIdx = 0, done = false;

    offsets.forEach(function(o, i){
      var el = document.createElement('div');
      el.className = 'l9-dot';
      el.style.left = (cx+o[0]-23) + 'px';
      el.style.top = (cy+o[1]-23) + 'px';
      var rank = order.indexOf(i);
      el.style.opacity = brightness[rank];
      el.innerHTML = '<span>' + (rank+1) + '</span>';
      wrap.appendChild(el);
      dots.push({el:el, index:i, rank:rank});
    });

    function onDown(e){
      if(done) return;
      var target = e.target.closest && e.target.closest('.l9-dot');
      if(!target) return;
      var obj = dots.find(function(d){ return d.el === target; });
      if(!obj) return;
      if(obj.rank === nextIdx){
        obj.el.classList.add('tapped');
        nextIdx++;
        if(nextIdx >= dots.length){
          done = true;
          var flash = wrap.querySelector('#l9flash');
          flash.style.opacity = '1';
          setTimeout(completeLevel, 550);
        }
      } else {
        obj.el.classList.add('wrong');
        setTimeout(function(){ obj.el.classList.remove('wrong'); }, 300);
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    cleanupFns.push(function(){ wrap.removeEventListener('pointerdown', onDown); });

    currentHintFn = function(){
      dots.forEach(function(d){ d.el.classList.add('numbered'); });
      setTimeout(function(){
        dots.forEach(function(d){ if(!d.el.classList.contains('tapped')) d.el.classList.remove('numbered'); });
      }, 2600);
    };
  }

  /* ============================================================
     LEVEL 11 — Twin rings  (HARD, has hint)
     Two dots orbit at different speeds; tap only when BOTH are
     inside their target zones at once.
     ============================================================ */
  function level11(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l11-base"></div>' +
      '<div class="l11-wrap">' +
        '<svg viewBox="0 0 240 240">' +
          '<circle class="l11-track" cx="120" cy="120" r="105"></circle>' +
          '<circle class="l11-track" cx="120" cy="120" r="65"></circle>' +
          '<circle class="l11-target" id="l11targetA" cx="120" cy="15" r="7"></circle>' +
          '<circle class="l11-target" id="l11targetB" cx="120" cy="55" r="6"></circle>' +
          '<circle class="l11-dot" id="l11dotA" cx="120" cy="15" r="5"></circle>' +
          '<circle class="l11-dot" id="l11dotB" cx="120" cy="55" r="4"></circle>' +
        '</svg>' +
        '<div class="l11-hits" id="l11hits">0 / 4</div>' +
      '</div>' +
      '<div class="l11-flash" id="l11flash"></div>';
    root.appendChild(wrap);

    var tA = wrap.querySelector('#l11targetA'), tB = wrap.querySelector('#l11targetB');
    var dA = wrap.querySelector('#l11dotA'), dB = wrap.querySelector('#l11dotB');
    var hitsEl = wrap.querySelector('#l11hits');
    var flash = wrap.querySelector('#l11flash');
    var CX=120, CY=120, RA=105, RB=65;
    var speedA = 0.0021, speedB = -0.0032;
    var angA = -Math.PI/2, angB = -Math.PI/2;
    var targetA = Math.random()*Math.PI*2, targetB = Math.random()*Math.PI*2;
    var tolerance = 0.2;
    var hits = 0, needed = 4, done = false, raf = null;

    function place(el,ang,r){ el.setAttribute('cx', CX+r*Math.cos(ang)); el.setAttribute('cy', CY+r*Math.sin(ang)); }
    function angleDiff(a,b){ var d=Math.abs(a-b)%(Math.PI*2); return Math.min(d,Math.PI*2-d); }
    place(tA,targetA,RA); place(tB,targetB,RB);

    function tick(){
      angA += speedA*16; angB += speedB*16;
      place(dA,angA,RA); place(dB,angB,RB);
      var okA = angleDiff(angA,targetA) < tolerance;
      var okB = angleDiff(angB,targetB) < tolerance;
      tA.classList.toggle('armed', okA);
      tB.classList.toggle('armed', okB);
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    function nextTargets(){
      targetA = Math.random()*Math.PI*2; targetB = Math.random()*Math.PI*2;
      place(tA,targetA,RA); place(tB,targetB,RB);
    }
    function onTap(){
      if(done) return;
      var okA = angleDiff(angA,targetA) < tolerance;
      var okB = angleDiff(angB,targetB) < tolerance;
      if(okA && okB){
        hits++;
        hitsEl.textContent = hits + ' / ' + needed;
        if(hits >= needed){
          done = true;
          flash.style.opacity = '1';
          setTimeout(completeLevel, 550);
          return;
        }
        nextTargets();
      }
    }
    wrap.addEventListener('pointerdown', onTap);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onTap);
      if(raf) cancelAnimationFrame(raf);
    });

    currentHintFn = function(){
      tolerance = 0.5;
      tA.classList.add('hint'); tB.classList.add('hint');
      setTimeout(function(){ tolerance = 0.2; tA.classList.remove('hint'); tB.classList.remove('hint'); }, 4500);
    };
  }

  /* ============================================================
     LEVEL 12 — Six shards  (HARD, has hint)
     ============================================================ */
  function level12(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML = '<div class="l12-base"></div><div class="l12-flash" id="l12flash"></div>';
    root.appendChild(wrap);

    var W = window.innerWidth, H = window.innerHeight;
    var cx = W/2, cy = H/2;
    var N = 6, radius = 82;
    var slots = [];
    for(var i=0;i<N;i++){
      var ang = -Math.PI/2 + i*(Math.PI*2/N);
      var ox = Math.round(Math.cos(ang)*radius), oy = Math.round(Math.sin(ang)*radius);
      var slot = document.createElement('div');
      slot.className = 'l4-slot';
      slot.style.left = (cx+ox-32)+'px';
      slot.style.top = (cy+oy-32)+'px';
      slot.style.transform = 'rotate(' + Math.round(ang*180/Math.PI + 90) + 'deg)';
      wrap.appendChild(slot);
      slots.push({x:cx+ox, y:cy+oy, rot: Math.round(ang*180/Math.PI+90), el:slot});
    }

    var placedCount = 0;
    var shards = [];
    var edgeSpots = [
      [40,40],[W-104,40],[40,H-104],[W-104,H-104],
      [W/2-32,40],[W/2-32,H-104]
    ];
    edgeSpots.forEach(function(pos,i){
      var s = document.createElement('div');
      s.className = 'shard';
      var rot = Math.floor(Math.random()*4)*90 + 15;
      s.style.left = pos[0]+'px'; s.style.top = pos[1]+'px';
      s.style.transform = 'rotate('+rot+'deg)';
      wrap.appendChild(s);
      shards.push({el:s, targetIndex:i, placed:false});
    });

    var dragging=null, offX=0, offY=0;
    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function placeShard(obj){
      var slot = slots[obj.targetIndex];
      obj.el.style.left = (slot.x-32)+'px'; obj.el.style.top = (slot.y-32)+'px';
      obj.el.style.transform = 'rotate('+slot.rot+'deg)';
      obj.el.classList.add('placed'); obj.placed = true; placedCount++;
      if(placedCount === shards.length){
        setTimeout(function(){
          var flash = wrap.querySelector('#l12flash');
          flash.style.clipPath = 'circle(150% at 50% 50%)';
          setTimeout(completeLevel, 700);
        }, 250);
      }
    }
    function onDown(e){
      var target = e.target.closest && e.target.closest('.shard');
      if(!target || target.classList.contains('placed')) return;
      var obj = shards.find(function(s){ return s.el===target; });
      if(!obj) return;
      dragging = obj;
      var p = pos(e), r = target.getBoundingClientRect();
      offX = p[0]-r.left; offY = p[1]-r.top;
      target.style.zIndex = 10; target.style.cursor='grabbing';
    }
    function onMove(e){
      if(!dragging) return;
      var p = pos(e);
      dragging.el.style.left = (p[0]-offX)+'px';
      dragging.el.style.top = (p[1]-offY)+'px';
    }
    function onUp(){
      if(!dragging) return;
      var slot = slots[dragging.targetIndex];
      var r = dragging.el.getBoundingClientRect();
      var ccx=r.left+r.width/2, ccy=r.top+r.height/2;
      var d = Math.hypot(ccx-slot.x, ccy-slot.y);
      if(d < 42){ placeShard(dragging); }
      if(dragging) dragging.el.style.cursor='grab';
      dragging = null;
    }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
    });

    currentHintFn = function(){
      var next = shards.find(function(s){ return !s.placed; });
      if(!next) return;
      var slot = slots[next.targetIndex];
      next.el.classList.add('hintglow'); slot.el.classList.add('hintglow');
      setTimeout(function(){ next.el.classList.remove('hintglow'); slot.el.classList.remove('hintglow'); }, 1600);
    };
  }

  /* ============================================================
     LEVEL 13 — Memory sequence (Simon)  (HARD, has hint)
     ============================================================ */
  function level13(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l13-base"></div>' +
      '<div class="l13-progress" id="l13progress">watch</div>' +
      '<div class="l13-flash" id="l13flash"></div>';
    root.appendChild(wrap);

    var W = window.innerWidth, H = window.innerHeight;
    var cx = W/2, cy = H/2;
    var offsets = [ [-75,-75], [75,-75], [75,75], [-75,75] ];
    var dots = offsets.map(function(o,i){
      var el = document.createElement('div');
      el.className = 'l13-dot';
      el.style.left = (cx+o[0]-28)+'px';
      el.style.top = (cy+o[1]-28)+'px';
      wrap.appendChild(el);
      return {el:el, index:i};
    });

    var ROUNDS = 5;
    var sequence = [];
    for(var i=0;i<ROUNDS;i++){ sequence.push(Math.floor(Math.random()*4)); }
    var playerIdx = 0, round = 1, done = false, accepting = false;
    var progressEl = wrap.querySelector('#l13progress');

    function lightUp(i, cb){
      dots[i].el.classList.add('lit');
      setTimeout(function(){
        dots[i].el.classList.remove('lit');
        setTimeout(cb, 180);
      }, 420);
    }
    function playSequence(upTo){
      accepting = false;
      progressEl.textContent = 'watch';
      var i = 0;
      function step(){
        if(i >= upTo){ accepting = true; playerIdx = 0; progressEl.textContent = 'repeat it'; return; }
        lightUp(sequence[i], function(){ i++; step(); });
      }
      setTimeout(step, 500);
    }
    playSequence(round);

    function onDown(e){
      if(done || !accepting) return;
      var target = e.target.closest && e.target.closest('.l13-dot');
      if(!target) return;
      var obj = dots.find(function(d){ return d.el===target; });
      if(!obj) return;
      if(obj.index === sequence[playerIdx]){
        obj.el.classList.add('lit');
        setTimeout(function(){ obj.el.classList.remove('lit'); }, 200);
        playerIdx++;
        if(playerIdx >= round){
          if(round >= ROUNDS){
            done = true;
            var flash = wrap.querySelector('#l13flash');
            flash.style.opacity = '1';
            setTimeout(completeLevel, 550);
          } else {
            round++;
            setTimeout(function(){ playSequence(round); }, 500);
          }
        }
      } else {
        obj.el.classList.add('wrong');
        setTimeout(function(){ obj.el.classList.remove('wrong'); }, 300);
        accepting = false;
        setTimeout(function(){ playSequence(round); }, 700);
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    cleanupFns.push(function(){ wrap.removeEventListener('pointerdown', onDown); });

    currentHintFn = function(){
      if(!accepting) return;
      var idx = sequence[playerIdx];
      dots[idx].el.classList.add('lit');
      setTimeout(function(){ dots[idx].el.classList.remove('lit'); }, 500);
    };
  }

  /* ============================================================
     LEVEL 14 — Twin dials  (HARD, has hint)
     Align an inner and outer dial to their marks; each locks in
     place once correct, and both must be locked to finish.
     ============================================================ */
  function level14(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    var size = Math.min(window.innerWidth, window.innerHeight) * 0.72;
    wrap.innerHTML =
      '<div class="l14-base"></div>' +
      '<div class="l14-wrap" style="width:'+size+'px;height:'+size+'px;">' +
        '<svg viewBox="0 0 220 220" style="width:'+size+'px;height:'+size+'px;">' +
          '<circle class="l14-ring" cx="110" cy="110" r="95"></circle>' +
          '<circle class="l14-ring" cx="110" cy="110" r="55"></circle>' +
          '<line class="l14-tick" id="l14tickOuter" x1="110" y1="110" x2="110" y2="15"></line>' +
          '<line class="l14-tick" id="l14tickInner" x1="110" y1="110" x2="110" y2="55"></line>' +
          '<line class="l14-arrow" id="l14arrowOuter" x1="110" y1="110" x2="110" y2="35"></line>' +
          '<line class="l14-arrow" id="l14arrowInner" x1="110" y1="110" x2="110" y2="65"></line>' +
        '</svg>' +
      '</div>' +
      '<div class="l14-flash" id="l14flash"></div>';
    root.appendChild(wrap);

    var scale = size/220;
    var tickO = wrap.querySelector('#l14tickOuter'), tickI = wrap.querySelector('#l14tickInner');
    var arrowO = wrap.querySelector('#l14arrowOuter'), arrowI = wrap.querySelector('#l14arrowInner');
    var flash = wrap.querySelector('#l14flash');
    var CX=110, CY=110;
    var targetO = Math.random()*Math.PI*2, targetI = Math.random()*Math.PI*2;
    var curO = -Math.PI/2, curI = -Math.PI/2;
    var tolerance = 0.16;
    var lockedO = false, lockedI = false, dragMode = null;

    function setLine(el, ang, len){ el.setAttribute('x2', CX+len*Math.cos(ang)); el.setAttribute('y2', CY+len*Math.sin(ang)); }
    function angleDiff(a,b){ var d=Math.abs(a-b)%(Math.PI*2); return Math.min(d,Math.PI*2-d); }
    setLine(tickO,targetO,95); setLine(tickI,targetI,55);
    setLine(arrowO,curO,75); setLine(arrowI,curI,40);

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function svgCenter(){ var r = wrap.querySelector('.l14-wrap').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
    function checkFinish(){
      if(lockedO && lockedI){
        flash.style.opacity = '1';
        setTimeout(completeLevel, 550);
      }
    }
    function onDown(e){
      var p = pos(e), c = svgCenter();
      var d = Math.hypot(p[0]-c[0], p[1]-c[1]) / scale;
      dragMode = d < 75 ? 'inner' : 'outer';
      onMove(e);
    }
    function onMove(e){
      if(!dragMode) return;
      var p = pos(e), c = svgCenter();
      var ang = Math.atan2(p[1]-c[1], p[0]-c[0]);
      if(dragMode === 'outer' && !lockedO){
        curO = ang; setLine(arrowO,curO,75);
      } else if(dragMode === 'inner' && !lockedI){
        curI = ang; setLine(arrowI,curI,40);
      }
    }
    function onUp(){
      if(dragMode === 'outer' && !lockedO && angleDiff(curO,targetO) < tolerance){
        lockedO = true; arrowO.classList.add('locked'); checkFinish();
      }
      if(dragMode === 'inner' && !lockedI && angleDiff(curI,targetI) < tolerance){
        lockedI = true; arrowI.classList.add('locked'); checkFinish();
      }
      dragMode = null;
    }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
    });

    currentHintFn = function(){
      tolerance = 0.45;
      if(!lockedO) tickO.classList.add('hint');
      if(!lockedI) tickI.classList.add('hint');
      setTimeout(function(){ tolerance = 0.16; tickO.classList.remove('hint'); tickI.classList.remove('hint'); }, 4500);
    };
  }

  /* ============================================================
     LEVEL 15 — Timed crack  (HARD, has hint)
     Same as level 1, but the ice regrows unless you crack it
     fully before the timer bar runs out.
     ============================================================ */
  function level15(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l15-base"></div>' +
      '<div class="l15-fill" id="l15fill"></div>' +
      '<div class="l15-ring"></div>' +
      '<div class="l15-timerwrap"><div class="l15-timerbar" id="l15bar"></div></div>' +
      '<div class="l15-fail" id="l15fail"></div>';
    root.appendChild(wrap);

    var fill = wrap.querySelector('#l15fill');
    var bar = wrap.querySelector('#l15bar');
    var fail = wrap.querySelector('#l15fail');
    var LIMIT = 4200;
    var pct = 0, done = false, extraTime = 0;
    var startTs = null, raf = null;

    function spawnCrack(x, y){
      var c = document.createElement('div');
      c.className = 'l15-crack';
      var cx = window.innerWidth/2, cy = window.innerHeight/2;
      var dx = x-cx, dy = y-cy;
      var len = 30+Math.random()*70;
      var ang = Math.atan2(dy,dx) + (Math.random()-0.5)*0.6;
      c.style.left = cx+'px'; c.style.top = cy+'px'; c.style.width = len+'px';
      c.style.transform = 'rotate('+ang+'rad)';
      wrap.appendChild(c);
      requestAnimationFrame(function(){ c.style.opacity='1'; });
      setTimeout(function(){ c.style.opacity='0'; setTimeout(function(){ c.remove(); }, 400); }, 900);
    }
    function resetRun(){
      pct = 0;
      fill.style.transition = 'clip-path .25s ease';
      fill.style.clipPath = 'circle(0% at 50% 50%)';
      startTs = null;
    }
    function tick(ts){
      if(done) return;
      if(!startTs) startTs = ts;
      var elapsed = ts - startTs;
      var remain = Math.max(0, 1 - elapsed/(LIMIT+extraTime));
      bar.style.transform = 'scaleX(' + remain + ')';
      if(remain <= 0){
        fail.style.opacity = '.9';
        setTimeout(function(){ fail.style.opacity='0'; }, 260);
        resetRun();
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    function onDown(e){
      if(done) return;
      var x = (e.touches ? e.touches[0].clientX : e.clientX);
      var y = (e.touches ? e.touches[0].clientY : e.clientY);
      pct = Math.min(130, pct + 11 + Math.random()*5);
      fill.style.clipPath = 'circle(' + pct + '% at 50% 50%)';
      spawnCrack(x,y);
      if(pct >= 100 && !done){
        done = true;
        fill.style.clipPath = 'circle(150% at 50% 50%)';
        if(raf) cancelAnimationFrame(raf);
        setTimeout(completeLevel, 500);
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      if(raf) cancelAnimationFrame(raf);
    });

    currentHintFn = function(){
      extraTime += 3000;
    };
  }

  /* ============================================================
     LEVEL 16 — Eight-way swipe  (HARD, has hint)
     ============================================================ */
  function level16(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML = '<div class="l16-base"></div><div class="l16-flash" id="l16flash"></div>';
    root.appendChild(wrap);

    var W = window.innerWidth, H = window.innerHeight;
    var cx = W/2, cy = H/2;
    var R = Math.min(W,H)*0.34;
    var DIR_NAMES = ['up','upright','right','downright','down','downleft','left','upleft'];
    var arrowSvgs = {
      up:'M12 4 L18 11 M12 4 L6 11 M12 4 L12 20',
      down:'M12 20 L18 13 M12 20 L6 13 M12 20 L12 4',
      left:'M4 12 L11 6 M4 12 L11 18 M4 12 L20 12',
      right:'M20 12 L13 6 M20 12 L13 18 M20 12 L4 12',
      upright:'M18 6 L18 12 M18 6 L12 6 M18 6 L6 18',
      downright:'M18 18 L18 12 M18 18 L12 18 M18 18 L6 6',
      downleft:'M6 18 L6 12 M6 18 L12 18 M6 18 L18 6',
      upleft:'M6 6 L6 12 M6 6 L12 6 M6 6 L18 18'
    };
    var els = {};
    DIR_NAMES.forEach(function(name, i){
      var ang = -Math.PI/2 + i*(Math.PI*2/8);
      var x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
      var el = document.createElement('div');
      el.className = 'l16-arrow';
      el.style.left = (x-18)+'px'; el.style.top = (y-18)+'px';
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#eaf7fb" stroke-width="2" stroke-linecap="round"><path d="'+arrowSvgs[name]+'"/></svg>';
      wrap.appendChild(el);
      els[name] = el;
    });

    var order = DIR_NAMES.slice().sort(function(){ return Math.random()-0.5; });
    var idx = 0;
    els[order[0]].classList.add('active');

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    var startX=0,startY=0,tracking=false;
    function onDown(e){ var p=pos(e); startX=p[0]; startY=p[1]; tracking=true; }
    function onUp(e){
      if(!tracking) return;
      tracking=false;
      var p = pos(e.changedTouches ? e.changedTouches[0] : e);
      var dx=p[0]-startX, dy=p[1]-startY;
      if(Math.hypot(dx,dy) < 36) return;
      var ang = Math.atan2(dy,dx);
      var deg = ang*180/Math.PI;
      if(deg < 0) deg += 360;
      var sector = Math.round(deg/45) % 8;
      var mapping = ['right','downright','down','downleft','left','upleft','up','upright'];
      var dir = mapping[sector];
      var expected = order[idx];
      if(dir === expected){
        els[expected].classList.remove('active');
        els[expected].classList.add('cleared');
        idx++;
        if(idx >= order.length){
          var flash = wrap.querySelector('#l16flash');
          flash.style.opacity = '1';
          setTimeout(completeLevel, 550);
        } else {
          els[order[idx]].classList.add('active');
        }
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointerup', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointerup', onUp);
    });

    currentHintFn = function(){
      var el = els[order[idx]];
      el.style.transform = 'scale(1.5)';
      el.style.opacity = '1';
      setTimeout(function(){ el.style.transform = ''; }, 1400);
    };
  }

  /* ============================================================
     LEVEL 17 — Chase the drift  (HARD, has hint)
     A target drifts around the screen; hold your finger on it
     continuously (it evades slightly) until the ring fills.
     ============================================================ */
  function level17(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l17-base"></div>' +
      '<div class="l17-ringwrap" id="l17ringwrap"><svg viewBox="0 0 150 150">' +
        '<circle class="l17-ring-bg" cx="75" cy="75" r="68"></circle>' +
        '<circle class="l17-ring-fg" id="l17ring" cx="75" cy="75" r="68" stroke-dasharray="427" stroke-dashoffset="427"></circle>' +
      '</svg></div>' +
      '<div class="l17-target" id="l17target"></div>' +
      '<div class="l17-flash" id="l17flash"></div>';
    root.appendChild(wrap);

    var target = wrap.querySelector('#l17target');
    var ringwrap = wrap.querySelector('#l17ringwrap');
    var ring = wrap.querySelector('#l17ring');
    var flash = wrap.querySelector('#l17flash');
    var W = window.innerWidth, H = window.innerHeight;
    var tx = W/2, ty = H/2;
    var vx = (Math.random()-0.5)*1.6, vy = (Math.random()-0.5)*1.6;
    var CIRC = 427;
    var THRESHOLD = 3600;
    var heldMs = 0, holding = false, lastTick = null, done = false, raf = null;
    var pointerX = null, pointerY = null;

    function place(){
      target.style.left = tx+'px'; target.style.top = ty+'px';
      ringwrap.style.left = tx+'px'; ringwrap.style.top = ty+'px';
    }
    place();

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function onDown(e){ if(done) return; var p=pos(e); pointerX=p[0]; pointerY=p[1]; checkHold(); }
    function onMove(e){ if(!holding && pointerX===null) return; var p=pos(e); pointerX=p[0]; pointerY=p[1]; checkHold(); }
    function onUp(){ pointerX=null; pointerY=null; holding=false; }
    function checkHold(){
      var d = Math.hypot(pointerX-tx, pointerY-ty);
      holding = d < 40;
    }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
      if(raf) cancelAnimationFrame(raf);
    });

    function tick(ts){
      if(!lastTick) lastTick = ts;
      var dt = ts-lastTick; lastTick = ts;
      if(!done){
        tx += vx; ty += vy;
        if(tx < 60 || tx > W-60) vx *= -1;
        if(ty < 60 || ty > H-60) vy *= -1;
        tx = Math.max(60, Math.min(W-60, tx));
        ty = Math.max(60, Math.min(H-60, ty));
        place();
        if(pointerX !== null) checkHold();
        if(holding){
          heldMs = Math.min(THRESHOLD, heldMs+dt);
          ring.setAttribute('stroke-dashoffset', CIRC*(1-heldMs/THRESHOLD));
          if(heldMs >= THRESHOLD){
            done = true;
            flash.style.opacity = '1';
            setTimeout(completeLevel, 550);
            return;
          }
        } else {
          heldMs = Math.max(0, heldMs - dt*0.5);
          ring.setAttribute('stroke-dashoffset', CIRC*(1-heldMs/THRESHOLD));
        }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);

    currentHintFn = function(){
      var origVx = vx, origVy = vy;
      vx *= 0.25; vy *= 0.25;
      setTimeout(function(){ vx = origVx; vy = origVy; }, 3500);
    };
  }

  /* ============================================================
     LEVEL 18 — Trace the rune  (HARD, has hint)
     Drag along a glowing star-shaped path without straying too
     far from the line, covering enough of it to finish.
     ============================================================ */
  function level18(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l18-base"></div>' +
      '<canvas class="l18-canvas" id="l18canvas"></canvas>' +
      '<div class="l18-progress" id="l18progress">trace the rune</div>' +
      '<div class="l18-flash" id="l18flash"></div>';
    root.appendChild(wrap);

    var canvas = wrap.querySelector('#l18canvas');
    var ctx = canvas.getContext('2d');
    var progressEl = wrap.querySelector('#l18progress');
    var flash = wrap.querySelector('#l18flash');
    var W,H,cx,cy,R;
    var pathPts = [];
    var covered = null;
    var done = false;

    function buildStar(){
      pathPts = [];
      var points = 5;
      for(var i=0;i<=points*2;i++){
        var ang = -Math.PI/2 + i*(Math.PI/points);
        var r = (i%2===0) ? R : R*0.42;
        pathPts.push([cx+r*Math.cos(ang), cy+r*Math.sin(ang)]);
      }
    }
    function drawBase(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(143,211,240,.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      pathPts.forEach(function(p,i){ i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); });
      ctx.stroke();
    }
    function drawSegHit(idx){
      var a = pathPts[idx], b = pathPts[idx+1];
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
      ctx.stroke();
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W/2; cy = H/2;
      R = Math.min(W,H)*0.28;
      buildStar();
      covered = new Uint8Array(pathPts.length-1);
      drawBase();
    }
    resize();
    window.addEventListener('resize', resize);
    cleanupFns.push(function(){ window.removeEventListener('resize', resize); });

    function distToSeg(px,py,a,b){
      var dx=b[0]-a[0], dy=b[1]-a[1];
      var len2 = dx*dx+dy*dy;
      var t = len2 ? Math.max(0,Math.min(1, ((px-a[0])*dx+(py-a[1])*dy)/len2)) : 0;
      var ex = a[0]+t*dx, ey = a[1]+t*dy;
      return Math.hypot(px-ex, py-ey);
    }
    function markNear(px,py){
      var tol = 34;
      for(var i=0;i<pathPts.length-1;i++){
        if(covered[i]) continue;
        if(distToSeg(px,py,pathPts[i],pathPts[i+1]) < tol){
          covered[i] = 1;
          drawSegHit(i);
        }
      }
      var count = 0;
      for(var j=0;j<covered.length;j++){ if(covered[j]) count++; }
      var pct = Math.round(count/covered.length*100);
      progressEl.textContent = pct + '%';
      if(count === covered.length && !done){
        done = true;
        flash.style.opacity = '1';
        setTimeout(completeLevel, 550);
      }
    }
    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    var drawing = false;
    function onDown(e){ if(done) return; drawing = true; var p = pos(e); markNear(p[0],p[1]); }
    function onMove(e){ if(!drawing || done) return; var p = pos(e); markNear(p[0],p[1]); }
    function onUp(){ drawing = false; }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
    });

    currentHintFn = function(){
      for(var i=0;i<covered.length;i++){
        if(!covered[i]){
          ctx.strokeStyle = 'rgba(143,211,240,.9)';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(pathPts[i][0],pathPts[i][1]);
          ctx.lineTo(pathPts[i+1][0],pathPts[i+1][1]);
          ctx.stroke();
          setTimeout(function(){ if(!done) drawBase(); for(var k=0;k<covered.length;k++){ if(covered[k]) drawSegHit(k); } }, 900);
          break;
        }
      }
    };
  }

  /* ============================================================
     LEVEL 19 — Frost sprites  (HARD, has hint)
     Blue sprites flash briefly at random spots — tap them before
     they fade. Red sprites must be avoided.
     ============================================================ */
  function level19(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l19-base"></div>' +
      '<div class="l19-score" id="l19score">0 / 8</div>' +
      '<div class="l19-flash" id="l19flash"></div>' +
      '<div class="l19-fail" id="l19fail"></div>';
    root.appendChild(wrap);

    var scoreEl = wrap.querySelector('#l19score');
    var flash = wrap.querySelector('#l19flash');
    var fail = wrap.querySelector('#l19fail');
    var W = window.innerWidth, H = window.innerHeight;
    var needed = 8, score = 0, misses = 0, maxMisses = 3, done = false;
    var spawnTimer = null;
    var slowMode = false;

    function spawn(){
      if(done) return;
      var isBad = Math.random() < 0.32;
      var el = document.createElement('div');
      el.className = 'l19-target' + (isBad ? ' bad' : '');
      var margin = 70;
      var x = margin + Math.random()*(W-margin*2);
      var y = margin + 140 + Math.random()*(H-margin*2-180);
      el.style.left = (x-25)+'px'; el.style.top = (y-25)+'px';
      wrap.appendChild(el);
      requestAnimationFrame(function(){ el.classList.add('show'); });

      var life = slowMode ? 1400 : 850;
      var timeoutId = setTimeout(function(){ remove(); }, life);
      var removed = false;
      function remove(){
        if(removed) return;
        removed = true;
        el.classList.remove('show');
        setTimeout(function(){ el.remove(); }, 200);
      }
      function onTap(ev){
        ev.stopPropagation();
        if(done || removed) return;
        clearTimeout(timeoutId);
        if(isBad){
          misses++;
          fail.style.opacity = '.85';
          setTimeout(function(){ fail.style.opacity='0'; }, 220);
          if(misses >= maxMisses){ misses = 0; score = Math.max(0, score-2); }
        } else {
          score++;
          scoreEl.textContent = Math.min(score,needed) + ' / ' + needed;
          if(score >= needed && !done){
            done = true;
            flash.style.opacity = '1';
            clearInterval(spawnTimer);
            setTimeout(completeLevel, 550);
          }
        }
        remove();
      }
      el.addEventListener('pointerdown', onTap);
    }
    spawnTimer = setInterval(spawn, 620);
    spawn();

    cleanupFns.push(function(){ clearInterval(spawnTimer); });

    currentHintFn = function(){
      slowMode = true;
      setTimeout(function(){ slowMode = false; }, 5000);
    };
  }

  /* ============================================================
     LEVEL 20 — The final rime (boss)  (HARD, has hint)
     Combines three quick challenges back to back: crack, hold,
     and a directional swipe — clear all three to finish the game.
     ============================================================ */
  function level20(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l20-base"></div>' +
      '<div class="l20-label" id="l20label">stage 1 / 3 — crack it</div>' +
      '<div id="l20stage"></div>' +
      '<div class="l20-flash" id="l20flash"></div>';
    root.appendChild(wrap);

    var label = wrap.querySelector('#l20label');
    var stageWrap = wrap.querySelector('#l20stage');
    var flash = wrap.querySelector('#l20flash');
    var phase = 1;
    var localCleanup = [];

    function clearStage(){
      localCleanup.forEach(function(fn){ try{ fn(); }catch(e){} });
      localCleanup = [];
      stageWrap.innerHTML = '';
    }

    function finishAll(){
      flash.style.opacity = '1';
      setTimeout(completeLevel, 650);
    }

    /* --- phase 1: crack --- */
    function startPhase1(){
      label.textContent = 'stage 1 / 3 \u2014 crack it';
      stageWrap.innerHTML =
        '<div class="l1-fill" id="b1fill" style="clip-path:circle(0% at 50% 50%);"></div>' +
        '<div class="l1-ring"></div>';
      var fill = stageWrap.querySelector('#b1fill');
      var pct = 0, done = false;
      function onDown(e){
        if(done) return;
        pct = Math.min(130, pct + 14 + Math.random()*6);
        fill.style.clipPath = 'circle(' + pct + '% at 50% 50%)';
        if(pct >= 100){
          done = true;
          fill.style.clipPath = 'circle(150% at 50% 50%)';
          setTimeout(function(){ clearStage(); phase=2; startPhase2(); }, 450);
        }
      }
      wrap.addEventListener('pointerdown', onDown);
      localCleanup.push(function(){ wrap.removeEventListener('pointerdown', onDown); });
      currentHintFn = function(){ pct = Math.min(130, pct+40); fill.style.clipPath = 'circle('+pct+'% at 50% 50%)'; if(pct>=100){ onDown({}); } };
    }

    /* --- phase 2: hold --- */
    function startPhase2(){
      label.textContent = 'stage 2 / 3 \u2014 hold steady';
      stageWrap.innerHTML =
        '<div class="l5-ring-wrap" style="position:relative;">' +
          '<svg viewBox="0 0 150 150">' +
            '<circle class="l5-ring-bg" cx="75" cy="75" r="68"></circle>' +
            '<circle class="l5-ring-fg" id="b2ring" cx="75" cy="75" r="68" stroke-dasharray="427" stroke-dashoffset="427"></circle>' +
          '</svg>' +
        '</div>';
      var ring = stageWrap.querySelector('#b2ring');
      var CIRC = 427, THRESHOLD = 2200;
      var heldMs = 0, holding = false, lastTick = null, done = false, raf = null;
      function tick(ts){
        if(!lastTick) lastTick = ts;
        var dt = ts-lastTick; lastTick = ts;
        if(holding && !done){
          heldMs = Math.min(THRESHOLD, heldMs+dt);
          ring.setAttribute('stroke-dashoffset', CIRC*(1-heldMs/THRESHOLD));
          if(heldMs >= THRESHOLD){
            done = true;
            setTimeout(function(){ clearStage(); phase=3; startPhase3(); }, 400);
            return;
          }
        }
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);
      function onDown(){ if(!done) holding = true; }
      function onUp(){ holding = false; }
      wrap.addEventListener('pointerdown', onDown);
      wrap.addEventListener('pointerup', onUp);
      wrap.addEventListener('pointerleave', onUp);
      localCleanup.push(function(){
        wrap.removeEventListener('pointerdown', onDown);
        wrap.removeEventListener('pointerup', onUp);
        wrap.removeEventListener('pointerleave', onUp);
        if(raf) cancelAnimationFrame(raf);
      });
      currentHintFn = function(){ heldMs = Math.min(THRESHOLD, heldMs + THRESHOLD*0.5); };
    }

    /* --- phase 3: swipe sequence --- */
    function startPhase3(){
      label.textContent = 'stage 3 / 3 \u2014 swipe it away';
      var W = window.innerWidth, H = window.innerHeight;
      var cx = W/2, cy = H/2;
      var DIRS = {
        up:{x:cx,y:cy-90,svg:'M12 4 L19 12 M12 4 L5 12 M12 4 L12 20'},
        down:{x:cx,y:cy+90,svg:'M12 20 L19 12 M12 20 L5 12 M12 20 L12 4'},
        left:{x:cx-90,y:cy,svg:'M4 12 L12 5 M4 12 L12 19 M4 12 L20 12'},
        right:{x:cx+90,y:cy,svg:'M20 12 L12 5 M20 12 L12 19 M20 12 L4 12'}
      };
      var order = ['up','right','down','left','up','left'];
      var idx = 0, els = {};
      Object.keys(DIRS).forEach(function(k){
        var d = DIRS[k];
        var el = document.createElement('div');
        el.className = 'l6-arrow';
        el.style.position='absolute';
        el.style.left = (d.x-20)+'px'; el.style.top = (d.y-20)+'px';
        el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#eaf7fb" stroke-width="2" stroke-linecap="round"><path d="'+d.svg+'"/></svg>';
        stageWrap.appendChild(el);
        els[k] = el;
      });
      els[order[0]].classList.add('active');

      function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
      var startX=0,startY=0,tracking=false;
      function onDown(e){ var p=pos(e); startX=p[0]; startY=p[1]; tracking=true; }
      function onUp(e){
        if(!tracking) return;
        tracking=false;
        var p = pos(e.changedTouches ? e.changedTouches[0] : e);
        var dx=p[0]-startX, dy=p[1]-startY;
        if(Math.hypot(dx,dy) < 36) return;
        var dir;
        if(Math.abs(dx) > Math.abs(dy)) dir = dx>0?'right':'left';
        else dir = dy>0?'down':'up';
        var expected = order[idx];
        if(dir === expected){
          els[expected].classList.remove('active');
          els[expected].classList.add('cleared');
          idx++;
          if(idx >= order.length){
            finishAll();
          } else if(els[order[idx]]){
            els[order[idx]].classList.add('active');
          }
        }
      }
      wrap.addEventListener('pointerdown', onDown);
      wrap.addEventListener('pointerup', onUp);
      localCleanup.push(function(){
        wrap.removeEventListener('pointerdown', onDown);
        wrap.removeEventListener('pointerup', onUp);
      });
      currentHintFn = function(){
        var el = els[order[idx]];
        if(el){ el.style.transform='scale(1.6)'; setTimeout(function(){ el.style.transform=''; },1200); }
      };
    }

    startPhase1();
    cleanupFns.push(function(){ clearStage(); });
  }

  /* ============================================================
     LEVEL 21 — Order dots, hexagon  (HARD, has hint)
     ============================================================ */
  function level21(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML = '<div class="l9-base"></div><div class="l9-flash" id="l21flash"></div>';
    root.appendChild(wrap);

    var W = window.innerWidth, H = window.innerHeight;
    var cx = W/2, cy = H/2;
    var N = 6, radius = 100;
    var order = [];
    for(var i=0;i<N;i++) order.push(i);
    order = order.sort(function(){ return Math.random()-0.5; });
    var dots = [];
    for(var i2=0;i2<N;i2++){
      var ang = -Math.PI/2 + i2*(Math.PI*2/N);
      var ox = Math.cos(ang)*radius, oy = Math.sin(ang)*radius;
      var el = document.createElement('div');
      el.className = 'l9-dot';
      el.style.left = (cx+ox-23)+'px'; el.style.top = (cy+oy-23)+'px';
      var rank = order.indexOf(i2);
      el.style.opacity = 0.85 - rank*0.11;
      el.innerHTML = '<span>' + (rank+1) + '</span>';
      wrap.appendChild(el);
      dots.push({el:el, index:i2, rank:rank});
    }
    var nextIdx = 0, done = false;
    function onDown(e){
      if(done) return;
      var target = e.target.closest && e.target.closest('.l9-dot');
      if(!target) return;
      var obj = dots.find(function(d){ return d.el===target; });
      if(!obj) return;
      if(obj.rank === nextIdx){
        obj.el.classList.add('tapped');
        nextIdx++;
        if(nextIdx >= dots.length){
          done = true;
          var flash = wrap.querySelector('#l21flash');
          flash.style.opacity = '1';
          setTimeout(completeLevel, 550);
        }
      } else {
        obj.el.classList.add('wrong');
        setTimeout(function(){ obj.el.classList.remove('wrong'); }, 300);
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    cleanupFns.push(function(){ wrap.removeEventListener('pointerdown', onDown); });

    currentHintFn = function(){
      dots.forEach(function(d){ d.el.classList.add('numbered'); });
      setTimeout(function(){
        dots.forEach(function(d){ if(!d.el.classList.contains('tapped')) d.el.classList.remove('numbered'); });
      }, 2600);
    };
  }

  /* ============================================================
     LEVEL 22 — Track the drifting mark  (HARD, has hint)
     A mark on the ring slowly rotates; drag the arrow to stay on
     top of it continuously until the hold bar fills.

  function level22(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l8-base"></div>' +
      '<div class="l8-wrap">' +
        '<svg viewBox="0 0 220 220">' +
          '<circle class="l8-ring" cx="110" cy="110" r="95"></circle>' +
          '<line class="l8-tick" id="l22tick" x1="110" y1="110" x2="110" y2="20"></line>' +

        '</svg>' +
      '</div>' +
      '<div class="l8-flash" id="l22flash"></div>';
    root.appendChild(wrap);

    var tick = wrap.querySelector('#l22tick');
    var arrow = wrap.querySelector('#l22arrow');
    var flash = wrap.querySelector('#l22flash');
    var CX=110, CY=110;
    var markAngle = -Math.PI/2, markSpeed = 0.0013;
    var curAngle = -Math.PI/2;
    var tolerance = 0.24;
    var dragging = false, done = false;
    var heldMs = 0, THRESHOLD = 2600, raf = null, lastTick = null;

    function setLine(el, ang, len){ el.setAttribute('x2', CX+len*Math.cos(ang)); el.setAttribute('y2', CY+len*Math.sin(ang)); }
    function angleDiff(a,b){ var d=Math.abs(a-b)%(Math.PI*2); return Math.min(d,Math.PI*2-d); }
    setLine(arrow, curAngle, 75);

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function svgCenter(){ var r = wrap.querySelector('.l8-wrap').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
    function onDown(e){ dragging = true; onMove(e); }
    function onMove(e){
      if(!dragging || done) return;
      var p = pos(e), c = svgCenter();
      curAngle = Math.atan2(p[1]-c[1], p[0]-c[0]);
      setLine(arrow, curAngle, 75);
    }
    function onUp(){ dragging = false; }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
      if(raf) cancelAnimationFrame(raf);
    });

    function loop(ts){
      if(!lastTick) lastTick = ts;
      var dt = ts-lastTick; lastTick = ts;
      if(!done){
        markAngle += markSpeed*16;
        setLine(tick, markAngle, 90);
        var onTarget = dragging && angleDiff(curAngle, markAngle) < tolerance;
        if(onTarget){
          heldMs = Math.min(THRESHOLD, heldMs+dt);
        } else {
          heldMs = Math.max(0, heldMs - dt*0.7);
        }
        if(heldMs >= THRESHOLD){
          done = true;
          flash.style.opacity = '1';
          setTimeout(completeLevel, 550);
          return;
        }
      }
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);

    currentHintFn = function(){
      tolerance = 0.55; markSpeed = 0.0006;
      setTimeout(function(){ tolerance = 0.24; markSpeed = 0.0013; }, 4000);
    };
  }

  /* ============================================================
     LEVEL 23 — Deeper memory sequence  (HARD, has hint)
     ============================================================ */
  function level23(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l13-base"></div>' +

    var cx = W/2, cy = H/2;
    var N = 6, radius = 95;
    var dots = [];
    for(var i=0;i<N;i++){
      var ang = -Math.PI/2 + i*(Math.PI*2/N);
      var el = document.createElement('div');
      el.className = 'l13-dot';
      el.style.left = (cx+Math.cos(ang)*radius-28)+'px';
      el.style.top = (cy+Math.sin(ang)*radius-28)+'px';
      wrap.appendChild(el);
      dots.push({el:el, index:i});
    }

    var ROUNDS = 6;
    var sequence = [];
    for(var r=0;r<ROUNDS;r++){ sequence.push(Math.floor(Math.random()*N)); }
    var playerIdx = 0, round = 1, done = false, accepting = false;
    var progressEl = wrap.querySelector('#l23progress');

    function lightUp(i, cb){
      dots[i].el.classList.add('lit');
      setTimeout(function(){
        dots[i].el.classList.remove('lit');
        setTimeout(cb, 150);
      }, 360);
    }
    function playSequence(upTo){
      accepting = false;
      progressEl.textContent = 'watch';
      var i = 0;
      function step(){
        if(i >= upTo){ accepting = true; playerIdx = 0; progressEl.textContent = 'repeat it'; return; }
        lightUp(sequence[i], function(){ i++; step(); });
      }
      setTimeout(step, 450);
    }
    playSequence(round);

    function onDown(e){
      if(done || !accepting) return;
      var target = e.target.closest && e.target.closest('.l13-dot');
      if(!target) return;
      var obj = dots.find(function(d){ return d.el===target; });
      if(!obj) return;
      if(obj.index === sequence[playerIdx]){
        obj.el.classList.add('lit');
        setTimeout(function(){ obj.el.classList.remove('lit'); }, 180);
        playerIdx++;
        if(playerIdx >= round){
          if(round >= ROUNDS){
            done = true;
            var flash = wrap.querySelector('#l23flash');
            flash.style.opacity = '1';
            setTimeout(completeLevel, 550);
          } else {
            round++;
            setTimeout(function(){ playSequence(round); }, 450);
          }
        }
      } else {
        obj.el.classList.add('wrong');
        setTimeout(function(){ obj.el.classList.remove('wrong'); }, 300);
        accepting = false;
        setTimeout(function(){ playSequence(round); }, 650);
      }
    }
    wrap.addEventListener('pointerdown', onDown);
    cleanupFns.push(function(){ wrap.removeEventListener('pointerdown', onDown); });

    currentHintFn = function(){
      if(!accepting) return;
      var idx = sequence[playerIdx];
      dots[idx].el.classList.add('lit');
      setTimeout(function(){ dots[idx].el.classList.remove('lit'); }, 480);
    };
  }

  /* ============================================================

  function level25(root){
    var wrap = document.createElement('div');

    var R = Math.min(W,H)*0.34;
    var DIR_NAMES = ['up','upright','right','downright','down','downleft','left','upleft'];
    var arrowSvgs = {
      up:'M12 4 L18 11 M12 4 L6 11 M12 4 L12 20',
      down:'M12 20 L18 13 M12 20 L6 13 M12 20 L12 4',
      left:'M4 12 L11 6 M4 12 L11 18 M4 12 L20 12',
      right:'M20 12 L13 6 M20 12 L13 18 M20 12 L4 12',
      upright:'M18 6 L18 12 M18 6 L12 6 M18 6 L6 18',
      downright:'M18 18 L18 12 M18 18 L12 18 M18 18 L6 6',
      downleft:'M6 18 L6 12 M6 18 L12 18 M6 18 L18 6',
      upleft:'M6 6 L6 12 M6 6 L12 6 M6 6 L18 18'
    };
    var els = {};
    DIR_NAMES.forEach(function(name, i){
      var ang = -Math.PI/2 + i*(Math.PI*2/8);
      var x = cx + R*Math.cos(ang), y = cy + R*Math.sin(ang);
      var el = document.createElement('div');
      el.className = 'l16-arrow';
      el.style.left = (x-18)+'px'; el.style.top = (y-18)+'px';
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#eaf7fb" stroke-width="2" stroke-linecap="round"><path d="'+arrowSvgs[name]+'"/></svg>';
      wrap.appendChild(el);
      els[name] = el;
    });

    var order = [];
    for(var i2=0;i2<10;i2++){ order.push(DIR_NAMES[Math.floor(Math.random()*DIR_NAMES.length)]); }
    var idx = 0;
    els[order[0]].classList.add('active');

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    var startX=0,startY=0,tracking=false;
    function onDown(e){ var p=pos(e); startX=p[0]; startY=p[1]; tracking=true; }
    function onUp(e){
      if(!tracking) return;
      tracking=false;
      var p = pos(e.changedTouches ? e.changedTouches[0] : e);

      var mapping = ['right','downright','down','downleft','left','upleft','up','upright'];
      var dir = mapping[sector];
      var expected = order[idx];
      if(dir === expected){

        idx++;

      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointerup', onUp);
    });

      el.style.transform = 'scale(1.5)';
      el.style.opacity = '1';
      setTimeout(function(){ el.style.transform = ''; }, 1400);
    };
  }

    var fill = wrap.querySelector('#l26fill');

    var CIRC = 427, THRESHOLD = 3400;

      setTimeout(function(){
        if(activeDecoy && activeDecoy.el === el){
          el.classList.remove('show');
          setTimeout(function(){ el.remove(); }, 200);
          activeDecoy = null;
        }
      }, 1500);
    }
    decoyTimer = setInterval(spawnDecoy, 1800);

    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function onDown(e){ if(done) return; holding = true; var p = pos(e); px=p[0]; py=p[1]; }
    function onMove(e){
      if(!holding || done) return;
      var p = pos(e); px=p[0]; py=p[1];
      if(activeDecoy && Date.now() > ignoreUntil){
        var d = Math.hypot(px-activeDecoy.x, py-activeDecoy.y);

    }

    currentHintFn = function(){
      ignoreUntil = Date.now() + 4000;
      heldMs = Math.min(THRESHOLD, heldMs + THRESHOLD*0.25);
    };
  }

  /* ============================================================

  function level28(root){

      shards.push({el:s, targetIndex:i, placed:false});
    });

    var dragging=null, offX=0, offY=0;
    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    function placeShard(obj){
      var slot = slots[obj.targetIndex];
      obj.el.style.left = (slot.x-26)+'px'; obj.el.style.top = (slot.y-26)+'px';
      obj.el.style.transform = 'rotate('+slot.rot+'deg)';
      obj.el.classList.add('placed'); obj.placed = true; placedCount++;
      if(placedCount === shards.length){
        setTimeout(function(){
          var flash = wrap.querySelector('#l28flash');
          flash.style.clipPath = 'circle(150% at 50% 50%)';
          setTimeout(completeLevel, 700);
        }, 250);
      }
    }
    function onDown(e){
      var target = e.target.closest && e.target.closest('.shard');
      if(!target || target.classList.contains('placed')) return;
      var obj = shards.find(function(s){ return s.el===target; });
      if(!obj) return;
      dragging = obj;
      var p = pos(e), r = target.getBoundingClientRect();
      offX = p[0]-r.left; offY = p[1]-r.top;
      target.style.zIndex = 10; target.style.cursor='grabbing';
    }
    function onMove(e){
      if(!dragging) return;
      var p = pos(e);
      dragging.el.style.left = (p[0]-offX)+'px';
      dragging.el.style.top = (p[1]-offY)+'px';
    }
    function onUp(){
      if(!dragging) return;
      var slot = slots[dragging.targetIndex];
      var r = dragging.el.getBoundingClientRect();
      var ccx=r.left+r.width/2, ccy=r.top+r.height/2;
      var d = Math.hypot(ccx-slot.x, ccy-slot.y);
      if(d < 36){ placeShard(dragging); }
      if(dragging) dragging.el.style.cursor='grab';
      dragging = null;
    }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
    });

    currentHintFn = function(){
      var next = shards.find(function(s){ return !s.placed; });
      if(!next) return;
      var slot = slots[next.targetIndex];
      next.el.classList.add('hintglow'); slot.el.classList.add('hintglow');
      setTimeout(function(){ next.el.classList.remove('hintglow'); slot.el.classList.remove('hintglow'); }, 1600);
    };
  }

  /* ============================================================
     LEVEL 29 — Two runes  (HARD, has hint)
     Trace a star, then a triangle, without lifting off the line
     for too long.
     ============================================================ */
  function level29(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l18-base"></div>' +
      '<canvas class="l18-canvas" id="l29canvas"></canvas>' +
      '<div class="l18-progress" id="l29progress">trace rune 1 / 2</div>' +
      '<div class="l18-flash" id="l29flash"></div>';
    root.appendChild(wrap);

    var canvas = wrap.querySelector('#l29canvas');
    var ctx = canvas.getContext('2d');
    var progressEl = wrap.querySelector('#l29progress');
    var flash = wrap.querySelector('#l29flash');
    var W,H,cx,cy,R;
    var pathPts = [];
    var covered = null;
    var done = false;
    var shapeIdx = 0;

    function buildShape(idx){
      pathPts = [];
      if(idx === 0){
        var points = 5;
        for(var i=0;i<=points*2;i++){
          var ang = -Math.PI/2 + i*(Math.PI/points);
          var r = (i%2===0) ? R : R*0.42;
          pathPts.push([cx+r*Math.cos(ang), cy+r*Math.sin(ang)]);
        }
      } else {
        for(var j=0;j<=3;j++){
          var ang2 = -Math.PI/2 + j*(Math.PI*2/3);
          pathPts.push([cx+R*Math.cos(ang2), cy+R*Math.sin(ang2)]);
        }
      }
    }
    function drawBase(){
      ctx.clearRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(143,211,240,.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      pathPts.forEach(function(p,i){ i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]); });
      ctx.stroke();
    }
    function drawSegHit(idx){
      var a = pathPts[idx], b = pathPts[idx+1];
      ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
      ctx.stroke();
    }
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      cx = W/2; cy = H/2;
      R = Math.min(W,H)*0.28;
      buildShape(shapeIdx);
      covered = new Uint8Array(pathPts.length-1);
      drawBase();
    }
    resize();
    window.addEventListener('resize', resize);
    cleanupFns.push(function(){ window.removeEventListener('resize', resize); });

    function distToSeg(px,py,a,b){
      var dx=b[0]-a[0], dy=b[1]-a[1];
      var len2 = dx*dx+dy*dy;
      var t = len2 ? Math.max(0,Math.min(1, ((px-a[0])*dx+(py-a[1])*dy)/len2)) : 0;
      var ex = a[0]+t*dx, ey = a[1]+t*dy;
      return Math.hypot(px-ex, py-ey);
    }
    function advanceShape(){
      shapeIdx++;
      if(shapeIdx >= 2){
        done = true;
        flash.style.opacity = '1';
        setTimeout(completeLevel, 550);
        return;
      }
      progressEl.textContent = 'trace rune ' + (shapeIdx+1) + ' / 2';
      buildShape(shapeIdx);
      covered = new Uint8Array(pathPts.length-1);
      drawBase();
    }
    function markNear(px,py){
      var tol = 34;
      for(var i=0;i<pathPts.length-1;i++){
        if(covered[i]) continue;
        if(distToSeg(px,py,pathPts[i],pathPts[i+1]) < tol){
          covered[i] = 1;
          drawSegHit(i);
        }
      }
      var count = 0;
      for(var j=0;j<covered.length;j++){ if(covered[j]) count++; }
      if(count === covered.length && !done){
        setTimeout(advanceShape, 300);
      }
    }
    function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
    var drawing = false;
    function onDown(e){ if(done) return; drawing = true; var p = pos(e); markNear(p[0],p[1]); }
    function onMove(e){ if(!drawing || done) return; var p = pos(e); markNear(p[0],p[1]); }
    function onUp(){ drawing = false; }
    wrap.addEventListener('pointerdown', onDown);
    wrap.addEventListener('pointermove', onMove);
    wrap.addEventListener('pointerup', onUp);
    wrap.addEventListener('pointerleave', onUp);
    cleanupFns.push(function(){
      wrap.removeEventListener('pointerdown', onDown);
      wrap.removeEventListener('pointermove', onMove);
      wrap.removeEventListener('pointerup', onUp);
      wrap.removeEventListener('pointerleave', onUp);
    });

    currentHintFn = function(){
      for(var i=0;i<covered.length;i++){
        if(!covered[i]){
          ctx.strokeStyle = 'rgba(143,211,240,.9)';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(pathPts[i][0],pathPts[i][1]);
          ctx.lineTo(pathPts[i+1][0],pathPts[i+1][1]);
          ctx.stroke();
          setTimeout(function(){ if(!done){ drawBase(); for(var k=0;k<covered.length;k++){ if(covered[k]) drawSegHit(k); } } }, 900);
          break;
        }
      }
    };
  }

  /* ============================================================
     LEVEL 30 — The deep rime (final boss)  (HARD, has hint)
     Four back-to-back challenges: rotate, order-tap, swipe,
     then hold steady — clear all four to finish the game.
     ============================================================ */
  function level30(root){
    var wrap = document.createElement('div');
    wrap.className = 'lvl';
    wrap.innerHTML =
      '<div class="l20-base"></div>' +
      '<div class="l20-label" id="l30label">stage 1 / 4 — align it</div>' +
      '<div id="l30stage"></div>' +
      '<div class="l20-flash" id="l30flash"></div>';
    root.appendChild(wrap);

    var label = wrap.querySelector('#l30label');
    var stageWrap = wrap.querySelector('#l30stage');
    var flash = wrap.querySelector('#l30flash');
    var localCleanup = [];

    function clearStage(){
      localCleanup.forEach(function(fn){ try{ fn(); }catch(e){} });
      localCleanup = [];
      stageWrap.innerHTML = '';
    }
    function finishAll(){
      flash.style.opacity = '1';
      setTimeout(completeLevel, 650);
    }

    /* phase 1: rotate dial */
    function startPhase1(){
      label.textContent = 'stage 1 / 4 \u2014 align it';
      stageWrap.innerHTML =
        '<div class="l8-wrap"><svg viewBox="0 0 220 220">' +
          '<circle class="l8-ring" cx="110" cy="110" r="95"></circle>' +
          '<line class="l8-tick" id="b30tick" x1="110" y1="110" x2="110" y2="20"></line>' +
          '<line class="l8-arrow" id="b30arrow" x1="110" y1="110" x2="110" y2="35"></line>' +
        '</svg></div>';
      var tick = stageWrap.querySelector('#b30tick');
      var arrow = stageWrap.querySelector('#b30arrow');
      var CX=110, CY=110;
      var targetAngle = Math.random()*Math.PI*2;
      var curAngle = -Math.PI/2;
      var tolerance = 0.22;
      var dragging = false, done = false;
      function setLine(el, ang, len){ el.setAttribute('x2', CX+len*Math.cos(ang)); el.setAttribute('y2', CY+len*Math.sin(ang)); }
      function angleDiff(a,b){ var d=Math.abs(a-b)%(Math.PI*2); return Math.min(d,Math.PI*2-d); }
      setLine(tick,targetAngle,90); setLine(arrow,curAngle,75);
      function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
      function svgCenter(){ var r = stageWrap.querySelector('.l8-wrap').getBoundingClientRect(); return [r.left+r.width/2,r.top+r.height/2]; }
      function onDown(e){ dragging=true; onMove(e); }
      function onMove(e){ if(!dragging||done) return; var p=pos(e), c=svgCenter(); curAngle = Math.atan2(p[1]-c[1],p[0]-c[0]); setLine(arrow,curAngle,75); }
      function onUp(){
        if(!dragging) return;
        dragging = false;
        if(angleDiff(curAngle,targetAngle) < tolerance && !done){
          done = true;
          setTimeout(function(){ clearStage(); startPhase2(); }, 400);
        }
      }
      wrap.addEventListener('pointerdown', onDown);
      wrap.addEventListener('pointermove', onMove);
      wrap.addEventListener('pointerup', onUp);
      wrap.addEventListener('pointerleave', onUp);
      localCleanup.push(function(){
        wrap.removeEventListener('pointerdown', onDown);
        wrap.removeEventListener('pointermove', onMove);
        wrap.removeEventListener('pointerup', onUp);
        wrap.removeEventListener('pointerleave', onUp);
      });
      currentHintFn = function(){ tolerance = 0.5; tick.classList.add('hint'); setTimeout(function(){ tolerance=0.22; tick.classList.remove('hint'); },4000); };
    }

    /* phase 2: order tap */
    function startPhase2(){
      label.textContent = 'stage 2 / 4 \u2014 tap in order';
      var W = window.innerWidth, H = window.innerHeight;
      var cx = W/2, cy = H/2;
      var offsets = [ [-70,-70], [70,-70], [70,70], [-70,70] ];
      var order = [0,1,2,3].sort(function(){ return Math.random()-0.5; });
      var dots = [];
      offsets.forEach(function(o,i){
        var el = document.createElement('div');
        el.className = 'l9-dot';
        el.style.left = (cx+o[0]-23)+'px'; el.style.top = (cy+o[1]-23)+'px';
        var rank = order.indexOf(i);
        el.style.opacity = 0.85-rank*0.15;
        el.innerHTML = '<span>'+(rank+1)+'</span>';
        stageWrap.appendChild(el);
        dots.push({el:el,index:i,rank:rank});
      });
      var nextIdx = 0;
      function onDown(e){
        var target = e.target.closest && e.target.closest('.l9-dot');
        if(!target) return;
        var obj = dots.find(function(d){ return d.el===target; });
        if(!obj) return;
        if(obj.rank === nextIdx){
          obj.el.classList.add('tapped');
          nextIdx++;
          if(nextIdx >= dots.length){
            setTimeout(function(){ clearStage(); startPhase3(); }, 400);
          }
        } else {
          obj.el.classList.add('wrong');
          setTimeout(function(){ obj.el.classList.remove('wrong'); }, 300);
        }
      }
      wrap.addEventListener('pointerdown', onDown);
      localCleanup.push(function(){ wrap.removeEventListener('pointerdown', onDown); });
      currentHintFn = function(){
        dots.forEach(function(d){ d.el.classList.add('numbered'); });
        setTimeout(function(){ dots.forEach(function(d){ if(!d.el.classList.contains('tapped')) d.el.classList.remove('numbered'); }); }, 2400);
      };
    }

    /* phase 3: swipe sequence */
    function startPhase3(){
      label.textContent = 'stage 3 / 4 \u2014 swipe it away';
      var W = window.innerWidth, H = window.innerHeight;
      var cx = W/2, cy = H/2;
      var DIRS = {
        up:{x:cx,y:cy-90,svg:'M12 4 L19 12 M12 4 L5 12 M12 4 L12 20'},
        down:{x:cx,y:cy+90,svg:'M12 20 L19 12 M12 20 L5 12 M12 20 L12 4'},
        left:{x:cx-90,y:cy,svg:'M4 12 L12 5 M4 12 L12 19 M4 12 L20 12'},
        right:{x:cx+90,y:cy,svg:'M20 12 L12 5 M20 12 L12 19 M20 12 L4 12'}
      };
      var order = ['up','right','down','left','right'];
      var idx = 0, els = {};
      Object.keys(DIRS).forEach(function(k){
        var d = DIRS[k];
        var el = document.createElement('div');
        el.className = 'l6-arrow';
        el.style.position='absolute';
        el.style.left = (d.x-20)+'px'; el.style.top = (d.y-20)+'px';
        el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#eaf7fb" stroke-width="2" stroke-linecap="round"><path d="'+d.svg+'"/></svg>';
        stageWrap.appendChild(el);
        els[k] = el;
      });
      els[order[0]].classList.add('active');
      function pos(e){ if(e.touches) return [e.touches[0].clientX,e.touches[0].clientY]; return [e.clientX,e.clientY]; }
      var startX=0,startY=0,tracking=false;
      function onDown(e){ var p=pos(e); startX=p[0]; startY=p[1]; tracking=true; }
      function onUp(e){
        if(!tracking) return;
        tracking=false;
        var p = pos(e.changedTouches ? e.changedTouches[0] : e);
        var dx=p[0]-startX, dy=p[1]-startY;
        if(Math.hypot(dx,dy) < 36) return;
        var dir;
        if(Math.abs(dx) > Math.abs(dy)) dir = dx>0?'right':'left';
        else dir = dy>0?'down':'up';
        var expected = order[idx];
        if(dir === expected){
          els[expected].classList.remove('active');
          els[expected].classList.add('cleared');
          idx++;
          if(idx >= order.length){
            setTimeout(function(){ clearStage(); startPhase4(); }, 400);
          } else if(els[order[idx]]){
            els[order[idx]].classList.add('active');
          }
        }
      }
      wrap.addEventListener('pointerdown', onDown);
      wrap.addEventListener('pointerup', onUp);
      localCleanup.push(function(){
        wrap.removeEventListener('pointerdown', onDown);
        wrap.removeEventListener('pointerup', onUp);
      });
      currentHintFn = function(){
        var el = els[order[idx]];
        if(el){ el.style.transform='scale(1.6)'; setTimeout(function(){ el.style.transform=''; },1200); }
      };
    }

    /* phase 4: hold steady */
    function startPhase4(){
      label.textContent = 'stage 4 / 4 \u2014 hold steady';
      stageWrap.innerHTML =
        '<div class="l5-ring-wrap" style="position:relative;">' +
          '<svg viewBox="0 0 150 150">' +
            '<circle class="l5-ring-bg" cx="75" cy="75" r="68"></circle>' +
            '<circle class="l5-ring-fg" id="b30ring" cx="75" cy="75" r="68" stroke-dasharray="427" stroke-dashoffset="427"></circle>' +
          '</svg>' +
        '</div>';
      var ring = stageWrap.querySelector('#b30ring');
      var CIRC = 427, THRESHOLD = 2600;
      var heldMs = 0, holding = false, lastTick = null, done = false, raf = null;
      function tick(ts){
        if(!lastTick) lastTick = ts;
        var dt = ts-lastTick; lastTick = ts;
        if(holding && !done){
          heldMs = Math.min(THRESHOLD, heldMs+dt);
          ring.setAttribute('stroke-dashoffset', CIRC*(1-heldMs/THRESHOLD));
          if(heldMs >= THRESHOLD){
            done = true;
            finishAll();
            return;
          }
        }
        raf = requestAnimationFrame(tick);
      }
      raf = requestAnimationFrame(tick);
      function onDown(){ if(!done) holding = true; }
      function onUp(){ holding = false; }
      wrap.addEventListener('pointerdown', onDown);
      wrap.addEventListener('pointerup', onUp);
      wrap.addEventListener('pointerleave', onUp);
      localCleanup.push(function(){
        wrap.removeEventListener('pointerdown', onDown);
        wrap.removeEventListener('pointerup', onUp);
        wrap.removeEventListener('pointerleave', onUp);
        if(raf) cancelAnimationFrame(raf);
      });
      currentHintFn = function(){ heldMs = Math.min(THRESHOLD, heldMs + THRESHOLD*0.5); };
    }

    startPhase1();
    cleanupFns.push(function(){ clearStage(); });
  }

  var LEVELS = {
    1:level1, 2:level2, 3:level3, 4:level4, 5:level5,
    6:level6, 7:level7, 8:level8, 9:level9, 10:level10,
    11:level11, 12:level12, 13:level13, 14:level14, 15:level15,
    16:level16, 17:level17, 18:level18, 19:level19, 20:level20,
    21:level21, 22:level22, 23:level23, 24:level24, 25:level25,
    26:level26, 27:level27, 28:level28, 29:level29, 30:level30
  };

  /* ---------- title particles (ambient, no interaction) ---------- */
  (function(){
    var canvas = document.getElementById('titleParticles');
    var ctx = canvas.getContext('2d');
    var W,H,particles=[];
    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      particles = [];
      var n = Math.floor((W*H)/26000);
      for(var i=0;i<n;i++){
        particles.push({
          x:Math.random()*W, y:Math.random()*H,
          r:0.6+Math.random()*1.8,
          vy:0.08+Math.random()*0.25,
          vx:(Math.random()-0.5)*0.15,
          a:0.15+Math.random()*0.35
        });
      }
    }
    resize();
    window.addEventListener('resize', resize);
    function loop(){
      ctx.clearRect(0,0,W,H);
      particles.forEach(function(p){
        p.y += p.vy; p.x += p.vx;
        if(p.y>H){ p.y=-4; p.x = Math.random()*W; }
        ctx.beginPath();
        ctx.fillStyle = 'rgba(143,211,240,' + p.a + ')';
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  })();

  /* ---------- wiring ---------- */
  buildHud();
  loadProgress().then(function(n){ savedMax = n; updateTitleUI(); });

  screens.title.addEventListener('pointerdown', function(e){
    if(e.target === titleRestart) return;
    showScreen('game');
    hud.classList.add('show');
    var startAt = (savedMax > 0 && savedMax < TOTAL_LEVELS) ? savedMax+1 : 1;
    loadLevel(startAt);
  });
  titleRestart.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    clearProgress();
  });

  document.getElementById('btnReplay').addEventListener('pointerdown', function(e){
    e.stopPropagation();
    clearProgress();
    showScreen('title');
    hud.classList.remove('show');
    currentLevel = 0;
    updateHud();
  });

})();
</script>
